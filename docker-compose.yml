# 値は同じディレクトリの .env から読む（未設定・空なら起動前にエラーで止める）
services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:?.env に設定してください}
      BINANCE_API_KEY: ${BINANCE_API_KEY:?.env に設定してください}
      # 暗号化キーは環境変数ではなくファイルで渡す
      # （下の $env 許可で、ワークフローの式やコードから読めてしまうのを防ぐ）
      N8N_ENCRYPTION_KEY_FILE: /run/secrets/n8n_encryption_key
      # Binance ワークフローが $env から API キーを読むため、環境変数へのアクセスを許可する
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_PROXY_HOPS: "1"
      GENERIC_TIMEZONE: Asia/Tokyo
      TZ: Asia/Tokyo
      N8N_WEBHOOK_URL: https://${SUBDOMAIN:?.env に設定してください}.${DOMAIN_NAME:?.env に設定してください}/
    secrets:
      - n8n_encryption_key
    volumes:
      - n8n_data:/home/node/.n8n

  cf:
    image: cloudflare/cloudflared:latest
    container_name: cf
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:?.env に設定してください}
    depends_on:
      - n8n

secrets:
  # 中身は暗号化キーだけ（末尾に改行を入れない）。コンテナ内の node ユーザー（UID 1000）が読めること
  n8n_encryption_key:
    file: ./n8n_encryption_key

volumes:
  n8n_data:
