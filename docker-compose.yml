# 値は同じディレクトリの .env から読む（未設定・空なら起動前にエラーで止める）
# .env は ./create-env.sh で作る（秘密の値を画面に出さずに入力できる）
services:
  n8n:
    # 版を固定する。latest のままだと、作り直しやイメージの取り直しのときに、確かめていない版が入る
    # n8n は版が上がると動かなくなる変更がある（例: 2.0 で $env が既定で読めなくなった）
    # latest は安定版を指すので、3.x が安定版になると自動で 3.x に上がってしまう
    # 上げるときは、ここを書き換えた PR で確かめてから、サーバーで git pull と sudo docker compose up -d
    # 下げるのは避ける（新しい版がデータベースの形を変えるので、古い版がそのまま動くとは限らない）
    image: n8nio/n8n:2.47.3
    container_name: n8n
    restart: unless-stopped
    # ホストにはポートを開けない。cf コンテナが Docker のネットワーク内で http://n8n:5678 に転送する
    # （転送先は terraform/cloudflare.tf で管理）。動作確認は docker compose exec で行う
    environment:
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:?.env に設定してください}
      BINANCE_API_KEY: ${BINANCE_API_KEY:?.env に設定してください}
      # 暗号化キーは渡さず、n8n に初回起動時に作らせる（/home/node/.n8n/config に保存され、n8n_data ボリュームに残る）
      # 環境変数ではないので $env からは読めず、.n8n のファイルはノードから読めない（N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES の既定）
      # 設定ファイルの権限を 0600 にして、n8n のユーザーだけが読めるようにする
      # キーを控えるときは: sudo docker compose exec n8n cat /home/node/.n8n/config
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      # Binance ワークフローが $env から API キーを読むため、環境変数へのアクセスを許可する
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_PROXY_HOPS: "1"
      GENERIC_TIMEZONE: Asia/Tokyo
      TZ: Asia/Tokyo
      N8N_WEBHOOK_URL: https://${SUBDOMAIN:?.env に設定してください}.${DOMAIN_NAME:?.env に設定してください}/
    volumes:
      - n8n_data:/home/node/.n8n

  cf:
    # cloudflared は latest のままにする（古い版はサポートが切れていくので、上げ続けるほうが安全）
    # 取り直すときは: sudo docker compose pull cf && sudo docker compose up -d cf
    image: cloudflare/cloudflared:latest
    container_name: cf
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:?.env に設定してください}
    depends_on:
      - n8n

  # 支出記録の「質問」が使う LLM を、このサーバーの CPU で動かす（GPU はない）
  # n8n からは http://ollama:11434 で使う（認証情報 Ollama account の Base URL）。ホストにはポートを開けない
  # モデルは手で取得する: sudo docker compose exec ollama ollama pull gpt-oss:20b
  # 取得したモデルは ollama_data ボリュームに残る（サーバーを作り直すと消えるので、取り直す）
  ollama:
    # n8n と同じく版を固定する。上げるときは、ここを書き換えた PR で確かめてから、サーバーで git pull と sudo docker compose up -d
    image: ollama/ollama:0.40.16
    container_name: ollama
    restart: unless-stopped
    environment:
      # 一度に読み込むモデルは 1 つだけにする（2 つ載るとメモリが足りなくなる）
      OLLAMA_MAX_LOADED_MODELS: "1"
      # 同時に処理するリクエストは 1 つにする（並べて処理すると、その分メモリを使う）
      OLLAMA_NUM_PARALLEL: "1"
      # 一度に読める長さ（トークン数）。支出記録は長い指示文とスプレッドシート全体を渡すので、既定より長くする
      # 足りないと入力の先頭が切り捨てられて答えがおかしくなる。長くするほどメモリを使う
      OLLAMA_CONTEXT_LENGTH: "16384"
    # メモリを使い切って n8n まで止まらないよう、上限を付ける（超えたときは ollama だけが止まる）
    # サーバーのメモリは 24 GB。gpt-oss:20b は約 13 GB を使う
    mem_limit: 18g
    volumes:
      - ollama_data:/root/.ollama

volumes:
  n8n_data:
  ollama_data:
