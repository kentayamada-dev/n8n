#cloud-config
# インスタンスの初回起動時だけ実行される設定（Terraform の templatefile で値を埋め込む）
# 起動後に書き換えても今のインスタンスには反映されない（user_data は作成時にしか渡せないため）

# シリアル・コンソールでログインするためのパスワード（SSH を開けない運用のため必須）
chpasswd:
  expire: false
  users:
    - name: ubuntu
      password: ${password_hash}
      # 小文字の hash にする（使えるのは hash / text / RANDOM だけ）
      # 大文字の HASH はどれにも当てはまらず、エラーにならないままパスワードが設定されない
      type: hash

# SSH のパスワード認証は無効のままにする
ssh_pwauth: false

# パッケージ一覧を更新してから入れる。入れ終わるのは cloud-init の最後の段階（起動から数分）
# 終わったかは cloud-init status --wait で確かめる。入ったあとの更新は自動では入らない（sudo apt upgrade で更新する）
# git は下の runcmd でリポジトリを取得するのに使う
# gpg は下の runcmd で Docker の署名鍵の指紋を確かめるのに使う（Ubuntu の Minimal イメージには gpg がなく、apt が使う gpgv だけ）
#
# n8n を動かす Docker Engine と Docker Compose は、ここではなく下の runcmd で入れる（理由は runcmd の説明を参照）
package_update: true
packages:
  - git
  - gpg

# cloudflared（QUIC）が使う UDP の受信・送信バッファの上限を上げる
# 既定の上限（約 208 KiB）では「failed to sufficiently increase receive buffer size」の警告が出るため
# 値は quic-go の推奨（https://github.com/quic-go/quic-go/wiki/UDP-Buffer-Sizes）
# この 2 つはネットワーク名前空間ごとではなくホスト全体の値なので、ホストで上げればコンテナにも効く
# 次の起動からは systemd-sysctl がこのファイルを読む。初回の起動は下の runcmd で反映する
write_files:
  - path: /etc/sysctl.d/99-cloudflared-quic.conf
    content: |
      net.core.rmem_max=7500000
      net.core.wmem_max=7500000

# Docker のインストール・git・sysctl の反映は runcmd で行う。runcmd は packages を入れたあとに実行される
# runcmd は 1 つのシェルスクリプト（/bin/sh）として実行され、そのままだと途中で失敗しても次のコマンドに進み、
# 最後のコマンドの結果だけが成否になる。先頭で set -e にして、どれかが失敗したらそこで止め、
# cloud-init status がエラーになるようにする
# Terraform の templatefile が置き換えるのは「$ の直後に波かっこ」の形だけなので、$( ) や $VERSION_CODENAME はそのまま残る
#
# Docker は公式の apt リポジトリから入れる（https://docs.docker.com/engine/install/ubuntu/ と同じ手順）
# Ubuntu の docker.io・docker-compose-v2 は Docker の非公式パッケージで、公式版と競合するので使わない
#   - 署名鍵（Docker Release (CE deb)）は Docker のサイトから取得し、指紋が 9DC858229FC7DD38854AE2D88D81803C0EBFCD88 の
#     ときだけ使う（違えばそこで止まり、Docker は入らない）。鍵束には取り込まないので、gpg のホームは使い捨てにする
#   - apt は拡張子が .asc ならテキスト（ASCII 形式）の鍵をそのまま読めるので、取得したファイルを signed-by に指定する
#   - リポジトリの版（resolute など）は /etc/os-release の VERSION_CODENAME から取る
#   - cloud-init の apt の設定（keyid でキーサーバーから鍵を取る）を使わないのは、gpg が要るのに Minimal イメージにはなく、
#     packages で gpg を入れても apt の設定のほうが先に実行されるため
#   - Docker は直接使う 2 つだけ書く。docker-ce-cli・containerd.io は docker-ce の依存関係、
#     docker-buildx-plugin は推奨パッケージとして一緒に入る（Docker のドキュメントの 5 つと同じものが入る）
#   - docker-ce を入れると docker サービスは自動で起動・有効化される
#
# n8n のリポジトリ（docker-compose.yml など）は /home/ubuntu/n8n に取得する。公開リポジトリなので認証は要らない
# 取得するのは作成時点の main だけ。その後の更新は手で git pull する（自動で pull すると確認なしに本番へ出るため）
# .env（トンネルのトークンなど）は秘密の値で、ここに書くと OCI のメタデータに残るので、手で作る
#
# UDP バッファの反映は、失敗しても n8n は動くので、大事な clone のあとに行う
# sysctl -p は値を設定できなくても終了コード 0 を返すことがあるので、反映後の値を読み直して確かめる
runcmd:
  - set -e
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - |
    fpr="$(gpg --homedir "$(mktemp -d)" --show-keys --with-colons /etc/apt/keyrings/docker.asc | awk -F ':' '$1 == "fpr" { print $10; exit }')"
    test "$fpr" = 9DC858229FC7DD38854AE2D88D81803C0EBFCD88
  - chmod 644 /etc/apt/keyrings/docker.asc
  - echo "deb [signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-compose-plugin
  - git clone https://github.com/kentayamada-dev/n8n.git /home/ubuntu/n8n
  - chown -R ubuntu:ubuntu /home/ubuntu/n8n
  - sysctl -p /etc/sysctl.d/99-cloudflared-quic.conf
  - test "$(sysctl -n net.core.rmem_max)" -ge 7500000
  - test "$(sysctl -n net.core.wmem_max)" -ge 7500000
